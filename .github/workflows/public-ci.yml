name: Public CI

# Self-contained CI for the code-only public/package release. Unlike the private
# `ci.yml` (nightly studies matrix + dev/ golden master, which reference private
# paths), everything here runs against the shipped package alone:
#   - lint (ruff, the E4/E7/E9/F gate);
#   - build sdist + wheel and validate packaging metadata and README links;
#   - pip-install smoke on Python 3.10 / 3.11 / 3.12 (the advertised range).
# The study-port tests import the private `studies/` tree and are excluded from
# the release (.gitattributes), so only the package's own tiers run here. CPU
# only; no GPU, no golden master, no studies.

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No GPU on GitHub-hosted runners; force JAX onto CPU.
  JAX_PLATFORMS: cpu

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      # The pyproject lint gate (E4, E7, E9, F). Scope matches [tool.ruff]:
      # the package source. The tree passes clean; a regression fails the build.
      - name: Ruff lint gate
        run: ruff check hifi_anova --output-format=github

  build:
    name: Build & packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel and validate metadata
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Verify PyPI long-description links in both artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import tarfile
          import zipfile

          base = "https://github.com/Ramzee-S/Hifi-ANOVA/blob/main/"
          required = {
              base + path for path in (
                  "docs/USER_GUIDE.md",
                  "docs/CI_theory.md",
                  "docs/ishigami_showcase.md",
                  "docs/ishigami_showcase.html",
                  "benchmarks/README.md",
                  "LICENSE",
                  "LICENSING.md",
              )
          }
          relative = re.compile(
              r"\[[^]]+\]\((?!https?://|#|mailto:)[^)]+\)")
          absolute = re.compile(r"\]\((https?://[^)]+)\)")

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              member = next(
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA"))
              wheel_metadata = archive.read(member).decode()

          sdist = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as archive:
              member = next(
                  item for item in archive.getmembers()
                  if item.name.count("/") == 1
                  and item.name.endswith("/PKG-INFO"))
              stream = archive.extractfile(member)
              assert stream is not None
              sdist_metadata = stream.read().decode()

          for label, metadata in (
              ("wheel", wheel_metadata),
              ("sdist", sdist_metadata),
          ):
              bad = relative.findall(metadata)
              missing = required - set(absolute.findall(metadata))
              assert not bad, f"{label} has relative README links: {bad}"
              assert not missing, f"{label} lacks absolute links: {missing}"
              print(f"{label}: PyPI README link check passed")
          PY
      - name: Upload built wheel
        uses: actions/upload-artifact@v4
        with:
          name: hifi-anova-wheel
          path: dist/*.whl
          if-no-files-found: error

  smoke:
    name: Smoke (pip, Python ${{ matrix.python-version }})
    # Verifies the advertised 3.10-3.12 support from the wheel built above.
    # Tests are copied outside the checkout before pytest starts, preventing the
    # repository's source tree from shadowing the installed artifact.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: hifi-anova-wheel
          path: dist
      - name: Install built wheel + pytest
        run: pip install dist/*.whl pytest
      - name: Smoke tests
        run: |
          cp -R tests "$RUNNER_TEMP/tests"
          cp conftest.py pyproject.toml "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -c "import hifi_anova, pathlib; p = pathlib.Path(hifi_anova.__file__).resolve(); assert not p.is_relative_to(pathlib.Path('$GITHUB_WORKSPACE').resolve()), p"
          pytest tests/ -m smoke -q

  quick:
    name: Quick tier (fitting & analysis, Python 3.11)
    # Default tier (smoke + fitting & analysis; no integration/slow). One
    # interpreter is enough — the smoke job already spans the version matrix.
    # This job also installs the built wheel and runs outside the checkout.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: hifi-anova-wheel
          path: dist
      - name: Install built wheel + pytest
        run: pip install dist/*.whl pytest
      - name: Quick tier
        run: |
          cp -R tests "$RUNNER_TEMP/tests"
          cp conftest.py pyproject.toml "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -c "import hifi_anova, pathlib; p = pathlib.Path(hifi_anova.__file__).resolve(); assert not p.is_relative_to(pathlib.Path('$GITHUB_WORKSPACE').resolve()), p"
          pytest tests/ -q
