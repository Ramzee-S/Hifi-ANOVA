[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hifi_anova"
version = "0.1.0"
description = "HiFi-ANOVA (Hoeffding Interaction-Fidelity ANOVA): interpretable regression with analytic Sobol diagnostics for the conditional mean and variance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Internal-Use-1.0.0" }
authors = [{ name = "R. Sala" }]
keywords = [
    "regression",
    "interpretability",
    "sensitivity-analysis",
    "sobol-indices",
    "functional-anova",
    "hoeffding-decomposition",
    "uncertainty-quantification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "jax>=0.4.20",
    "equinox>=0.11.0",
    "optax>=0.2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
# Ground-truth Sobol comparison via Saltelli sampling (used by
# examples/run_salib_comparison.py). Not required to use the library.
salib = ["SALib>=1.4"]
# Development / testing.
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Ramzee-S/Hifi-ANOVA"
Repository = "https://github.com/Ramzee-S/Hifi-ANOVA"

[tool.setuptools.packages.find]
include = ["hifi_anova*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Intentional: model classes store constant Gram matrices / index arrays in
    # equinox static fields (kept out of the trainable-parameter set). See the
    # note in hifi_anova/__init__.py.
    "ignore:A JAX array is being set as static:UserWarning",
]
