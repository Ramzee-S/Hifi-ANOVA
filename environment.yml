# Reproducible conda environment for HiFi-ANOVA.
#   conda env create -f environment.yml
#   conda activate hifi_anova
#   pip install -e .
name: hifi_anova
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.6
  - pip
  - pip:
      # JAX ecosystem is most reliably installed via pip.
      # For GPU support, follow the official JAX install guide instead:
      # https://docs.jax.dev/en/latest/installation.html
      - jax>=0.4.20
      - equinox>=0.11.0
      - optax>=0.2.0
      - pytest>=7.0
      # Optional (examples/run_salib_comparison.py):
      # - SALib>=1.4
